name: Daily AI News Report

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00
    # GitHub Actions cron 使用 UTC 时区, 5 段格式: 分 时 日 月 周
    - cron: '0 1 * * *'
  # 允许手动触发(用于测试)
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest
    # 超时 45 分钟: 30 分钟重采等待 + 采集处理时间
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Daily Report
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BACKUP_API_KEY: ${{ secrets.LLM_BACKUP_API_KEY }}
          LLM_BACKUP_BASE_URL: ${{ secrets.LLM_BACKUP_BASE_URL }}
          LLM_BACKUP_MODEL: ${{ secrets.LLM_BACKUP_MODEL }}
          # GITHUB_TOKEN 由 GitHub Actions 自动提供, 无需手动配置
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ai_daily_report.py
